version: '3.8'
services:
  app:
    build: .
    restart: unless-stopped
    # Per-environment values live in each checkout's .env (never committed), so this file is the
    # same on prod and preview: prod leaves them unset (defaults below), preview sets
    # HOST_PORT=31622 and APP_ENV=preview (orange nav + "Preview" badge).
    ports:
      - "${HOST_PORT:-31621}:3000"
    volumes:
      - app-data:/data
    environment:
      - NODE_ENV=production
      - APP_ENV=${APP_ENV:-}
      - PREVIEW_NAME=${PREVIEW_NAME:-}
      - APP_VERSION=${APP_VERSION:-}
      - DATA_DIR=/data
      - SESSION_SECRET=${SESSION_SECRET}
      - JIRA_SERVICE_TOKEN=${JIRA_SERVICE_TOKEN}
      - CONFLUENCE_SERVICE_TOKEN=${CONFLUENCE_SERVICE_TOKEN}
      - CONFLUENCE_BASE=${CONFLUENCE_BASE}
      - BIGPICTURE_API_TOKEN=${BIGPICTURE_API_TOKEN}
      # What's new digest (scripts/send-digest.js) — a bot dedicated to it, and its target space.
      - DIGEST_WEBEX_BOT_TOKEN=${DIGEST_WEBEX_BOT_TOKEN}
      - DIGEST_WEBEX_ROOM_ID=${DIGEST_WEBEX_ROOM_ID}
      - SURICATE_PUBLIC_URL=${SURICATE_PUBLIC_URL}
volumes:
  app-data:
